[project]
name = "rewind-backend"
version = "0.1.0"
description = "Graph-backed selective memory repair for cooperating agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.143,<1", "uvicorn[standard]>=0.54,<1", "redis>=8.1,<9", "python-dotenv>=1,<2", "openai>=3.31,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

